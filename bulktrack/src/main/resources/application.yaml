server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

spring:
  application:
    name: bulktrack
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
